<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wurstfest Countdown</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    background:url('WFCountdown.jpg') center center no-repeat;
    background-size:cover;
    overflow:hidden;
    font-family:Georgia, serif;
}

#countdown{
    position:absolute;

    /* Move up/down */
    top:80%;

    /* Center horizontally */
    left:50%;

    transform:translate(-50%,-50%);

    width:100%;

    text-align:center;

    color:#e7c17c;

    font-size:4.5vw;

    font-weight:bold;

    letter-spacing:.12em;

    text-shadow:
        2px 2px 6px rgba(0,0,0,.9);
}

</style>

</head>

<body>

<div id="countdown">
Loading...
</div>

<script>

const targetDate = new Date('2026-11-13T18:00:00-06:00');

function updateCountdown() {

    const now = new Date();
    let diff = targetDate - now;

    if(diff <= 0){
        document.getElementById("countdown").innerHTML =
        "WURSTFEST HAS ARRIVED!";
        return;
    }

    const totalDays =
        Math.floor(diff / (1000 * 60 * 60 * 24));

    const months =
        Math.floor(totalDays / 30);

    const days =
        totalDays % 30;

    const hours =
        Math.floor((diff / (1000 * 60 * 60)) % 24);

    const minutes =
        Math.floor((diff / (1000 * 60)) % 60);

    const seconds =
        Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        String(months).padStart(2,'0')
        + " : " +
        String(days).padStart(2,'0')
        + " : " +
        String(hours).padStart(2,'0')
        + " : " +
        String(minutes).padStart(2,'0')
        + " : " +
        String(seconds).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
