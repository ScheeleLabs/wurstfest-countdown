<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wurstfest Countdown</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: url('WFCountdown.jpg') center center no-repeat;
    background-size: cover;
    overflow: hidden;
    font-family: Georgia, serif;
}

/* Title */
.title {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translateX(-50%);
    color: #e7c17c;
    font-size: 3.2vw;
    font-weight: bold;
    text-align: center;
    text-shadow:
        2px 2px 6px rgba(0,0,0,.85);
}

/* Countdown */
#countdown {
    position: absolute;
    top: 76%;
    left: 50%;
    transform: translateX(-50%);
    color: #e7c17c;
    font-size: 4vw;
    font-weight: bold;
    text-align: center;
    letter-spacing: .2em;
    text-shadow:
        2px 2px 6px rgba(0,0,0,.85);
}

/* Labels */
.labels {
    position: absolute;
    top: 84%;
    left: 50%;
    transform: translateX(-50%);
    color: #e7c17c;
    font-size: 1.1vw;
    letter-spacing: .15em;
    text-align: center;
    text-shadow:
        2px 2px 6px rgba(0,0,0,.85);
}

/* Date */
.date {
    position: absolute;
    top: 92%;
    left: 50%;
    transform: translateX(-50%);
    color: #e7c17c;
    font-size: 1.5vw;
    text-align: center;
    text-shadow:
        2px 2px 6px rgba(0,0,0,.85);
}

</style>
</head>

<body>

<div class="title">
    WURSTFEST IS COMING
</div>

<div id="countdown">
    Loading...
</div>

<div class="labels">
    MONTHS &nbsp;&nbsp; • &nbsp;&nbsp;
    DAYS &nbsp;&nbsp; • &nbsp;&nbsp;
    HOURS &nbsp;&nbsp; • &nbsp;&nbsp;
    MINUTES &nbsp;&nbsp; • &nbsp;&nbsp;
    SECONDS
</div>

<div class="date">
    NOVEMBER 13, 2026 • 6:00 PM
</div>

<script>

const targetDate = new Date('2026-11-13T18:00:00-06:00');

function updateCountdown() {

    const now = new Date();
    let diff = targetDate - now;

    if(diff <= 0) {
        document.getElementById("countdown").innerHTML =
            "WURSTFEST HAS ARRIVED!";
        return;
    }

    const daysTotal =
        Math.floor(diff / (1000 * 60 * 60 * 24));

    const months =
        Math.floor(daysTotal / 30);

    const days =
        daysTotal % 30;

    const hours =
        Math.floor((diff / (1000 * 60 * 60)) % 24);

    const minutes =
        Math.floor((diff / (1000 * 60)) % 60);

    const seconds =
        Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        String(months).padStart(2,'0')
        + " : " +
        String(days).padStart(2,'0')
        + " : " +
        String(hours).padStart(2,'0')
        + " : " +
        String(minutes).padStart(2,'0')
        + " : " +
        String(seconds).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
